plugins {
    id 'maven-publish'
    id 'fabric-loom' version '1.13.3'
    id 'babric-loom-extension' version '1.13.3'
    id 'io.freefair.lombok' version '8.+'
}

java.sourceCompatibility = JavaVersion.VERSION_17
java.targetCompatibility = JavaVersion.VERSION_17

base.archivesName = project.archives_base_name
version = project.mod_version
group = project.maven_group

loom {
    accessWidenerPath = file("src/main/resources/starac.accessWidener")
}

babric {
    disableM1Fixes.set(true) // Disable Gambáč since thats literraly this project :)
}

repositories {
    // Used for Babric Loom Extensions
    maven {
        name = 'Babric'
        url = 'https://maven.glass-launcher.net/babric'
    }

    // Used for many dependencies
    maven {
        name = 'Glass Releases'
        url = 'https://maven.glass-launcher.net/releases'
    }

    // Used for Snapshots
    maven {
        name = 'Glass Snapshots'
        url = 'https://maven.glass-launcher.net/snapshots'
    }

    // NyaRepo
    maven {
        name = "nyarepo"
        url = "https://maven.fildand.cz/releases"
    }

    // Used for a StationAPI dependency.
    maven {
        name = 'Froge'
        url 'https://maven.minecraftforge.net/'
    }

    // Used for projects that do not have a maven repository, but do have a GitHub repository with working build scripts.
    maven {
        name = 'Jitpack'
        url = 'https://jitpack.io'
    }

    // Modrinth Maven
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    maven { url 'https://mvn.devos.one/releases' }
    maven { url 'https://maven.wispforest.io' }
    mavenCentral()
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "me.alphamode:nostalgia:b1.7.3+build.46:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation "org.slf4j:slf4j-api:1.8.0-beta4"
    implementation 'org.apache.logging.log4j:log4j-slf4j18-impl:2.17.2'

    include implementation("com.google.guava:guava:33.4.0-jre")
    include implementation("commons-io:commons-io:2.18.0")

    modImplementation ("maven.modrinth:fast-stapi-intro:2.0.0")
    modImplementation ("net.modificationstation:StationAPI:${project.stapi_version}")


    implementation platform("org.lwjgl:lwjgl-bom:${lwjgl_version}")
    include platform("org.lwjgl:lwjgl-bom:${lwjgl_version}")

    ['linux', 'windows', 'macos', 'windows-arm64', 'macos-arm64', 'linux-arm64'].each { platform ->
        include runtimeOnly("org.lwjgl:lwjgl::natives-${platform}")
        include runtimeOnly("org.lwjgl:lwjgl-glfw::natives-${platform}")
        include runtimeOnly("org.lwjgl:lwjgl-openal::natives-${platform}")
        include runtimeOnly("org.lwjgl:lwjgl-opengl::natives-${platform}")
    }

    include implementation("org.lwjgl:lwjgl:${lwjgl_version}")
    include implementation("org.lwjgl:lwjgl-glfw:${lwjgl_version}")
    include implementation("org.lwjgl:lwjgl-openal:${lwjgl_version}")
    include implementation("org.lwjgl:lwjgl-opengl:${lwjgl_version}")
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

java {
    withSourcesJar()
}

tasks.withType(Jar).configureEach {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}"}
    }
}

// configure the maven publication
publishing {
    repositories {
        mavenLocal()
        if(project.hasProperty("calmilamsy_secret_publishing_cave_username")){
            maven {
                url = "https://maven.glass-launcher.net/releases"
                credentials {
                    username "${project.calmilamsy_secret_publishing_cave_username}"
                    password "${project.calmilamsy_secret_publishing_cave_password}"
                }
            }
        }

        if(project.hasProperty("nyarepo_publishing_cave_username")){
            maven {
                url = "https://maven.fildand.cz/releases"
                credentials {
                    username "${project.nyarepo_publishing_cave_username}"
                    password "${project.nyarepo_publishing_cave_password}"
                }
            }
        }
    }

    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
