plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.fabricmc.fabric-loom-remap' version '1.15.+'
    id 'ploceus' version '1.15-SNAPSHOT'
    id 'io.freefair.lombok' version '8.+'
}

base {
    archivesName = project.archives_base_name
}
version = "${project.mod_version}+mc${project.minecraft_version}+gen2"
group = project.maven_group

ploceus {
    setIntermediaryGeneration(2)
}

def lwjglVersion = project.lwjgl_version

loom {
    accessWidenerPath = file("src/main/resources/starac.accessWidener")
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url 'https://mvn.devos.one/releases' }
    maven { url 'https://maven.wispforest.io' }

    maven {url "https://maven.minecraftforge.net/" }
    maven {url "https://maven.glass-launcher.net/releases" }
    maven {url "https://maven.glass-launcher.net/snapshots" }
    maven {url "https://jitpack.io/" }
    exclusiveContent {
        forRepository {
            maven {url "https://api.modrinth.com/maven" }
        }
        filter {
            includeGroup("maven.modrinth")
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
//    mappings ploceus.featherMappings(project.feather_build)
    mappings(ploceus.mappings("net.glasslauncher:biny-ornithe:b1.7.3+build.${project.biny_mappings}:mergedv2"))


    clientExceptions ploceus.raven(project.client_raven_build, 'client')
    serverExceptions ploceus.raven(project.server_raven_build, 'server')
    clientSignatures ploceus.sparrow(project.client_sparrow_build, 'client')
    serverSignatures ploceus.sparrow(project.server_sparrow_build, 'server')
    "clientNests"("net.glasslauncher:biny-nests:b1.7.3-client+build.2")
    "serverNests"("net.glasslauncher:biny-nests:b1.7.3-server+build.2")

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // OSL — compile-time + dev-runtime. At RUNTIME OSL is OPTIONAL: every
    // OSL-touching class is gated behind OSL's own entrypoints, so when
    // osl-networking is absent the hub/sync feature is dormant and the rest
    // of starac works unchanged (see RetroCenter javadoc).
    ploceus.dependOsl(project.osl_version)

    api platform("org.lwjgl:lwjgl-bom:${lwjglVersion}")
    include platform("org.lwjgl:lwjgl-bom:${lwjglVersion}")

    ['linux', 'windows', 'macos', 'windows-arm64', 'macos-arm64', 'linux-arm64'].each { platform ->
        include runtimeOnly("org.lwjgl:lwjgl::natives-${platform}")
        include runtimeOnly("org.lwjgl:lwjgl-glfw::natives-${platform}")
        include runtimeOnly("org.lwjgl:lwjgl-openal::natives-${platform}")
        include runtimeOnly("org.lwjgl:lwjgl-opengl::natives-${platform}")
    }

    include api("org.lwjgl:lwjgl:${lwjglVersion}")
    include api("org.lwjgl:lwjgl-glfw:${lwjglVersion}")
    include api("org.lwjgl:lwjgl-openal:${lwjglVersion}")
    include api("org.lwjgl:lwjgl-opengl:${lwjglVersion}")

//    modImplementation("net.modificationstation:StationAPI:${project.stationapi_version}")
}

configurations.configureEach {
    exclude group: 'org.lwjgl.lwjgl'
}

processResources {
    inputs.property 'version', version

    filesMatching('fabric.mod.json') {
        expand 'version': version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 21
}

java {
    // Still required by IDEs such as Eclipse and Visual Studio Code
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21

    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    // If this mod is going to be a library, then it should also generate Javadocs in order to aid with development.
    // Uncomment this line to generate them.
    // withJavadocJar()
}

tasks.withType(Jar).configureEach {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}"}
    }
}

// starac minus org/lwjgl/** and bundled natives: what in-process child
// instances load as a mod. The child classloader shares org.lwjgl with the
// hub (one window, one set of natives), so the child's copy of starac must
// not carry its own — see ChildClassLoader / InProcessChildLauncher.
tasks.register('childShimJar', Jar) {
    dependsOn tasks.named('classes'), tasks.named('processResources')
    from sourceSets.main.output
    exclude 'org/lwjgl/**'
    exclude 'natives/**'
    // The bridge MUST resolve to the hub's single copy via parent
    // delegation — a child-local copy would have its own (empty) statics.
    exclude 'com/periut/starac/retrocenter/bridge/**'
    archiveClassifier = 'childshim'
}

// The shim must match the runtime's mappings: production runs intermediary,
// so it gets its own remap pass... (untyped wiring: loom's task classes live
// in a different plugin classloader, so typed named() lookups reject them)
def childShimName = "${project.archives_base_name}-${project.version}-childshim"
tasks.register('remapChildShimJar', net.fabricmc.loom.task.RemapJarTask) {
    dependsOn tasks.named('childShimJar')
    inputFile.set(layout.buildDirectory.file("libs/${childShimName}.jar"))
    archiveClassifier.set('childshim-intermediary')
    // no jar-in-jar: the child must NOT get its own LWJGL (shared with hub)
    addNestedDependencies.set(false)
}

// ...and is embedded INSIDE the distributed starac jar at
// retrocenter/childshim.jar — ServerProfiles self-extracts it at runtime,
// no manual install step.
tasks.named('remapJar') {
    dependsOn tasks.named('remapChildShimJar')
    from(layout.buildDirectory.file("libs/${childShimName}-intermediary.jar")) {
        into 'retrocenter'
        rename { 'childshim.jar' }
    }
}

// Dev runs use named mappings: point child launches straight at the
// named shim so in-process children work in runClient without any setup.
loom {
    runs {
        configureEach {
            vmArg "-Dretrocenter.childShimJar=${layout.buildDirectory.get().asFile}/libs/${project.archives_base_name}-${project.version}-childshim.jar"
        }
    }
}

tasks.named('build') { dependsOn 'childShimJar', 'remapChildShimJar' }

// configure the maven publication
publishing {
    repositories {
        mavenLocal()
        if(project.hasProperty("calmilamsy_secret_publishing_cave_username")){
            maven {
                url = "https://maven.glass-launcher.net/releases"
                credentials {
                    username "${project.calmilamsy_secret_publishing_cave_username}"
                    password "${project.calmilamsy_secret_publishing_cave_password}"
                }
            }
        }

        if(project.hasProperty("nyarepo_publishing_cave_username")){
            maven {
                url = "https://maven.fildand.cz/releases"
                credentials {
                    username "${project.nyarepo_publishing_cave_username}"
                    password "${project.nyarepo_publishing_cave_password}"
                }
            }
        }
    }

    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
